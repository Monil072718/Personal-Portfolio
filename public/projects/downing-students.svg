<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
      
    <rect width="800" height="38" fill="#0F172A"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <rect x="180" y="8" width="440" height="22" rx="11" fill="#1E293B"/>
    <text x="400" y="23" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-weight="500">downingstudents.com</text>
  
      <rect y="38" width="800" height="462" fill="#0D1117"/>
      <!-- Header -->
      <rect y="38" width="800" height="60" fill="#161B22"/>
      <text x="40" y="75" fill="#FFC107" font-size="18" font-family="system-ui, sans-serif" font-weight="800">DOWNING <tspan fill="#FFFFFF">STUDENTS</tspan></text>
      <text x="440" y="73" fill="#8B949E" font-size="12" font-family="system-ui, sans-serif">Locations</text>
      <text x="525" y="73" fill="#8B949E" font-size="12" font-family="system-ui, sans-serif">Offers</text>
      <text x="590" y="73" fill="#8B949E" font-size="12" font-family="system-ui, sans-serif">Wellbeing</text>
      <rect x="660" y="52" width="105" height="32" rx="16" fill="#FFC107"/>
      <text x="712" y="72" fill="#0D1117" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Find Room</text>
      <!-- Hero -->
      <g transform="translate(40, 130)">
        <text x="0" y="15" fill="#FFC107" font-size="11" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="1.5">35+ YEARS PROVIDING PREMIER UK STUDENT HOMES</text>
        <text x="0" y="55" fill="#FFFFFF" font-size="32" font-family="system-ui, sans-serif" font-weight="800">Purpose-Built Student Living</text>
        <text x="0" y="90" fill="#FFFFFF" font-size="32" font-family="system-ui, sans-serif" font-weight="800">In Top University Cities</text>
      </g>
      <!-- City Search Bar -->
      <g transform="translate(40, 240)">
        <rect width="720" height="60" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
        <text x="24" y="35" fill="#8B949E" font-size="12" font-family="system-ui, sans-serif">📍 Choose city: London, Manchester, Edinburgh, Liverpool, Newcastle...</text>
        <rect x="595" y="10" width="115" height="40" rx="8" fill="#FFC107"/>
        <text x="652" y="35" fill="#0D1117" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Search Rooms</text>
      </g>
      <!-- Property Highlights -->
      <g transform="translate(40, 320)">
        <rect width="220" height="145" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
        <text x="16" y="32" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="700">All-Inclusive Living</text>
        <text x="16" y="55" fill="#FFC107" font-size="11" font-family="system-ui, sans-serif">No unexpected energy bills</text>
        <text x="16" y="80" fill="#8B949E" font-size="11" font-family="system-ui, sans-serif">High-speed Wi-Fi, contents insurance, heating, and water all in one monthly sum.</text>
      </g>
      <g transform="translate(290, 320)">
        <rect width="220" height="145" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
        <text x="16" y="32" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="700">24/7 On-Site Support</text>
        <text x="16" y="55" fill="#FFC107" font-size="11" font-family="system-ui, sans-serif">Safe &amp; secure student community</text>
        <text x="16" y="80" fill="#8B949E" font-size="11" font-family="system-ui, sans-serif">Dedicated accommodation teams, parcel management, and emergency response.</text>
      </g>
      <g transform="translate(540, 320)">
        <rect width="220" height="145" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
        <text x="16" y="32" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="700">Wellbeing &amp; Social</text>
        <text x="16" y="55" fill="#FFC107" font-size="11" font-family="system-ui, sans-serif">Gyms, cinemas &amp; lounges</text>
        <text x="16" y="80" fill="#8B949E" font-size="11" font-family="system-ui, sans-serif">Free on-site fitness suites, study spaces, cinema rooms, and regular social events.</text>
      </g>
    </svg>