      <text x="480" y="69" fill="#9CA3AF" font-size="12" font-family="system-ui, sans-serif">Pipelines</text>
      <text x="560" y="69" fill="#9CA3AF" font-size="12" font-family="system-ui, sans-serif">Analytics</text>
      <text x="640" y="69" fill="#9CA3AF" font-size="12" font-family="system-ui, sans-serif">Enterprise</text>
      <rect x="715" y="50" width="55" height="28" rx="6" fill="#6366F1"/>
      <text x="742" y="68" fill="#FFFFFF" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Login</text>
      <!-- Hero Section -->
      <g transform="translate(40, 120)">
        <text x="0" y="20" fill="#818CF8" font-size="12" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="1.5">ENTERPRISE DATA PLATFORM</text>
        <text x="0" y="65" fill="#FFFFFF" font-size="34" font-family="system-ui, sans-serif" font-weight="800">Unify, Transform &amp; Stream</text>
        <text x="0" y="105" fill="#FFFFFF" font-size="34" font-family="system-ui, sans-serif" font-weight="800">Mission-Critical Data</text>
        <text x="0" y="145" fill="#9CA3AF" font-size="14" font-family="system-ui, sans-serif">Built with Next.js &amp; TypeScript. Real-time ETL pipeline orchestration.</text>
        <rect x="0" y="170" width="150" height="42" rx="8" fill="#6366F1"/>
        <text x="75" y="196" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Request Demo</text>
      </g>
      <!-- Data Visualization Mock -->
      <g transform="translate(460, 125)">
        <rect width="300" height="320" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
        <text x="24" y="36" fill="#FFFFFF" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Pipeline Throughput</text>
        <text x="24" y="56" fill="#10B981" font-size="11" font-family="system-ui, sans-serif">● 2.4 Million records/sec live</text>
        <!-- Bar Chart Visual -->
        <line x1="24" y1="180" x2="276" y2="180" stroke="#374151" stroke-width="1"/>
        <rect x="35" y="120" width="22" height="60" rx="4" fill="#6366F1"/>
        <rect x="70" y="95" width="22" height="85" rx="4" fill="#818CF8"/>
        <rect x="105" y="70" width="22" height="110" rx="4" fill="#6366F1"/>
        <rect x="140" y="110" width="22" height="70" rx="4" fill="#818CF8"/>
        <rect x="175" y="80" width="22" height="100" rx="4" fill="#6366F1"/>
        <rect x="210" y="60" width="22" height="120" rx="4" fill="#A5B4FC"/>
        <rect x="245" y="85" width="22" height="95" rx="4" fill="#6366F1"/>
