    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <rect x="180" y="8" width="440" height="22" rx="11" fill="#1E293B"/>
    <text x="400" y="23" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-weight="500">datalogie-web.vercel.app</text>
  
      <rect y="38" width="800" height="462" fill="#0A0E17"/>
